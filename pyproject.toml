[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finplan-config"
version = "2024.1.0"
description = "Shared configuration for finplan services (tax brackets, IRS limits, capital market assumptions)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "finplan team", email = "team@finplan.com" }]
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.4"]

[project.urls]
repository = "https://github.com/finplan/finplan-config"

[tool.pytest.ini_options]
testpaths = ["tests"]
