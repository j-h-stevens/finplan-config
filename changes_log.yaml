# finplan-config change log
#
# Machine-readable record of every config and code change.
# Downstream repos (finplan-compute-engine, finplan-api-gateway) should use
# finplan_config.changelog to detect breaking changes on version upgrade:
#
#   from finplan_config.changelog import has_breaking_changes_since
#   if has_breaking_changes_since("2024.1.0"):
#       raise RuntimeError("finplan-config has breaking changes — review before upgrading")
#
# Schema: see changes/YYYY-MM-DD-slug.yaml for individual entry format.
# This file is regenerated by: python scripts/aggregate_changelog.py

schema_version: 1
entries:
  - version: "2024.1.0"
    date: "2026-04-04"
    type: feat
    affected_configs:
      - tax_years/2024/federal_brackets.yaml
      - tax_years/2024/irs_limits.yaml
      - tax_years/2024/rmd_tables.yaml
      - tax_years/2024/state_tax.yaml
      - capital_market/exhibit17_10yr.yaml
      - capital_market/exhibit17_20yr.yaml
      - plan_defaults.yaml
    summary: >
      Bootstrap change log for existing 2024 tax year configuration.
    downstream_action_required: false
    notes: >
      Downstream repos should call has_breaking_changes_since(PINNED_VERSION) on startup.

  - version: "2024.2.0"
    date: "2026-04-04"
    type: security
    affected_configs: []
    summary: >
      Build and security improvements: thread-safe ConfigRegistry, year bounds validation,
      pinned CI action SHAs, uv cache, OIDC publishing, functional tests.
    downstream_action_required: false
    notes: >
      No config data changed. irs_limits(year=1800) now raises ValueError.
