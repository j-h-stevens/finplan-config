# finplan-config change log
#
# Machine-readable record of every config and code change.
# Downstream repos (finplan-compute-engine, finplan-api-gateway) should use
# finplan_config.changelog to detect breaking changes on version upgrade:
#
#   from finplan_config.changelog import has_breaking_changes_since
#   if has_breaking_changes_since("2024.1.0"):
#       raise RuntimeError("finplan-config has breaking changes — review before upgrading")
#
# DO NOT edit this file directly — edit individual files under changes/ instead,
# then regenerate with: python scripts/aggregate_changelog.py

schema_version: 1
entries:
- version: 2024.1.0
  date: '2026-04-04'
  type: feat
  affected_configs:
  - tax_years/2024/federal_brackets.yaml
  - tax_years/2024/irs_limits.yaml
  - tax_years/2024/rmd_tables.yaml
  - tax_years/2024/state_tax.yaml
  - capital_market/exhibit17_10yr.yaml
  - capital_market/exhibit17_20yr.yaml
  - plan_defaults.yaml
  summary: 'Bootstrap change log for existing 2024 tax year configuration. Establishes
    the cross-repo tracking system so finplan-compute-engine and finplan-api-gateway
    can detect breaking changes programmatically.

    '
  downstream_action_required: false
  notes: 'Downstream repos should import finplan_config.changelog and call has_breaking_changes_since(PINNED_VERSION)
    on startup to detect incompatible config upgrades before they affect live calculations.

    '
- version: 2024.2.0
  date: '2026-04-04'
  type: security
  affected_configs: []
  summary: 'Build and security improvements: thread-safe ConfigRegistry singleton
    (double-checked locking), year parameter bounds validation (1990-2100), pinned
    codecov action SHA, uv dependency cache in CI, OIDC trusted publishing (eliminates
    PYPI_TOKEN secret), functional data-correctness tests.

    '
  downstream_action_required: false
  notes: 'No config data changed. ConfigRegistry.get() is now safe to call from multiple
    threads concurrently. irs_limits(year=1800) now raises ValueError instead of silently
    falling back.

    '
- version: 2024.3.0
  date: '2026-04-05'
  type: security
  affected_configs:
  - tax_years/2024/federal_brackets.yaml
  - tax_years/2024/irs_limits.yaml
  - tax_years/2024/rmd_tables.yaml
  - tax_years/2024/state_tax.yaml
  summary: 'Security audit follow-up: add _metadata blocks (IRS source, date_published,
    last_verified) to all 2024 tax year YAML files for compliance audit trail. Fix
    CalVer version comparator, add plan_defaults validation, enforce UTF-8 encoding
    on all file opens, add TypeError guard on year parameter, stale-config UserWarning,
    available_tax_years(), config_manifest() API, and 36 new tests (88 total).

    '
  downstream_action_required: false
  notes: 'No values changed — only _metadata annotation blocks added. ConfigRegistry
    now emits UserWarning on initialize() when bundled tax year < current year. irs_limits(year=2024.5)
    now raises TypeError instead of silently coercing.

    '
