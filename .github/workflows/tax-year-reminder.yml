name: Tax Year Freshness Check

# Scheduled run (Jan 1): FAILS if current-year config is missing — treated as
# a P0 alert requiring action before April 15.
#
# Push/PR runs: WARNS (annotation) but does NOT fail so stale data doesn't
# block unrelated PRs.  The scheduled job is the enforcement gate.
#
# The IRS Rev. Proc. for year N is typically published in Oct–Nov of year N-1,
# so the config update should land before Dec 31 of the prior year.

on:
  schedule:
    # 09:00 UTC on January 1 — hard failure alert for the new year
    - cron: "0 9 1 1 *"
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tax-year-freshness:
    name: Verify current-year tax config exists
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check current tax year config is present
        run: |
          CURRENT_YEAR=$(date +%Y)
          CONFIG_DIR="finplan_config/tax_years/$CURRENT_YEAR"

          echo "Available tax years:"
          ls finplan_config/tax_years/ | sort

          if [ -d "$CONFIG_DIR" ]; then
            echo "✓ Tax year $CURRENT_YEAR config found at $CONFIG_DIR"
          else
            # On the scheduled Jan 1 run: hard failure (P0 alert)
            # On push/PR: annotation only — don't block unrelated changes
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "::error file=finplan_config/tax_years::Tax year $CURRENT_YEAR config is missing."
              echo ""
              echo "P0 ACTION REQUIRED before April 15 of $CURRENT_YEAR:"
              echo "  1. Obtain IRS Rev. Proc. for $CURRENT_YEAR (published Oct-Nov $(( CURRENT_YEAR - 1 )))"
              echo "  2. Create finplan_config/tax_years/$CURRENT_YEAR/ with:"
              echo "       federal_brackets.yaml, irs_limits.yaml, rmd_tables.yaml, state_tax.yaml"
              echo "  3. Add a changes/ entry: type: data, downstream_action_required: true"
              echo "  4. Bump version to $CURRENT_YEAR.1.0 in pyproject.toml"
              echo "  5. Run: python scripts/aggregate_changelog.py"
              exit 1
            else
              echo "::warning file=finplan_config/tax_years::Tax year $CURRENT_YEAR config" \
                   "is missing — action required before April 15, $CURRENT_YEAR."
              echo "See .github/workflows/tax-year-reminder.yml for update instructions."
            fi
          fi
