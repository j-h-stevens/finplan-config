name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Stage 1: Validate YAML configuration files
  # ─────────────────────────────────────────────────────────────────
  validate:
    name: Validate Config
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5.3.1
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: uv sync --frozen --extra dev

      - name: Validate YAML files
        run: |
          python -c "
          from pathlib import Path
          from finplan_config.validators import validate_all
          validate_all(Path('finplan_config'))
          print('✓ All YAML files validated successfully')
          "

  # ─────────────────────────────────────────────────────────────────
  # Stage 2: Lint & Format
  # ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5.3.1
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: uv sync --frozen --extra dev
      - run: uv run ruff check . --output-format=github
      - run: uv run ruff format --check .

  # ─────────────────────────────────────────────────────────────────
  # Stage 3: Tests (Python 3.12 + 3.13)
  # ─────────────────────────────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    needs: [validate, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5.3.1
        with:
          python-version: ${{ matrix.python-version }}

      - run: uv sync --frozen --extra dev

      - name: Run tests with coverage
        run: |
          uv run pytest tests/ \
            -v --tb=short \
            --cov=finplan_config \
            --cov-report=xml \
            --cov-report=term

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ─────────────────────────────────────────────────────────────────
  # Stage 4: Publish to PyPI (main branch only, manual dispatch)
  # ─────────────────────────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5.3.1
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: uv sync --frozen --extra dev

      - name: Build distribution
        run: uv build

      - name: Publish to PyPI
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [ -z "$PYPI_TOKEN" ]; then
            echo "PYPI_TOKEN not configured — skipping publish"
            exit 0
          fi
          uv publish \
            --publish-url https://upload.pypi.org/legacy/ \
            --token "$PYPI_TOKEN"
