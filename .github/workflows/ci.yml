name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Stage 1: Validate YAML configuration files + changelog enforcement
  #          + full test suite
  # ─────────────────────────────────────────────────────────────────
  validate:
    name: Validate Config
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0  # full history needed for changelog diff check

      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5.3.1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv sync --frozen --extra dev

      - name: Validate YAML files
        run: |
          python -c "
          from pathlib import Path
          from finplan_config.validators import validate_all
          validate_all(Path('finplan_config'))
          print('✓ All YAML files validated successfully')
          "

      - name: Quality checks
        run: bash scripts/run_checks.sh

      - name: Check changelog updated (PR only)
        if: github.event_name == 'pull_request'
        run: python scripts/check_changelog_updated.py

  # ─────────────────────────────────────────────────────────────────
  # Stage 2: Lint & Format
  # ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5.3.1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv sync --frozen --extra dev
      - run: uv run ruff check . --output-format=github
      - run: uv run ruff format --check .
